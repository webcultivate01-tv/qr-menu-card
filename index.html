<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel Harshvardhan | Delicious Food • Great Service</title>

    <meta name="description" content="Explore the delicious menu at Hotel Harshvardhan.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="./style.css">
</head>

<body class="homepage">

    <!-- HEADER -->
    <header class="site-header">
        <div class="header-container">

            <button class="mobile-menu-button"
                    aria-label="Open navigation menu"
                    aria-expanded="false">
                <i class="fa-solid fa-bars"></i>
            </button>

            <a href="./index.html" class="brand-logo">
                <span class="logo-icon">
                    <i class="fa-solid fa-utensils"></i>
                </span>

                <span class="logo-text">
                    <strong>Hotel Harshvardhan</strong>
                    <small>Delicious Food • Great Service</small>
                </span>
            </a>

            <nav class="desktop-navigation">
                <a href="./index.html" class="nav-link active">Home</a>
                <a href="./menu.html" class="nav-link">Menu</a>
            </nav>

            <div class="header-actions">

            </div>
        </div>

        <nav class="mobile-navigation">
            <a href="./index.html" class="mobile-nav-link active">Home</a>
            <a href="./menu.html" class="mobile-nav-link">Menu</a>

        </nav>
    </header>


    <main>

        <!-- MENU CATEGORIES -->
        <section class="categories-section section-container">

            <div class="section-heading">
                <div>
                    <span class="section-eyebrow">EXPLORE OUR</span>
                    <h2>Menu Categories</h2>
                </div>

                <a href="./menu.html" class="view-all-link">
                    View All
                    <i class="fa-solid fa-arrow-right"></i>
                </a>
            </div>

            <div class="categories-grid" id="categories-grid">
                <!-- Categories generated through JavaScript -->
            </div>

        </section>


        <!-- POPULAR DISHES -->
        <section class="popular-section section-container">

            <div class="section-heading">
                <div>
                    <span class="section-eyebrow">OUR FAVOURITES</span>
                    <h2>Most Loved Dishes</h2>
                </div>

                <a href="./menu.html" class="view-all-link">
                    View All
                    <i class="fa-solid fa-arrow-right"></i>
                </a>
            </div>

            <div class="popular-dishes-grid"
                 id="popular-dishes-grid">
                <!-- Dishes generated through JavaScript -->
            </div>

        </section>


    </main>



    <footer class="powered-by-footer"><p>Powered by <span>Webcultivate Software Solutions</span></p></footer>



    <script src="./script.js" defer></script>

</body>
</html>
